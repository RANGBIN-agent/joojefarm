const capital=sum(S.purch,'total'),profit=sum(S.sales,'total')-capital;return H('شرکا','سهم، پرداخت‌ها، بدهکاری و بستانکاری',`<button class="bt" onclick="A.pAdd()">+ شریک</button>`)+`<div class="hero"><small>سود / زیان خالص مشترک</small><strong>${mo(profit)}</strong>${S.halls.filter(h=>{const t=S.partners.reduce((a,p)=>a+((p.hs||{})[h.id]||0),0);return t>0&&Math.round(t)!=100}).map(h=>'<div class="sl">⚠️ مجموع سهم شرکا در سالن '+h.name+' برابر ۱۰۰٪ نیست</div>').join('')}<small>تسویه پیشنهادی بین شرکا</small>${tr.join('')||'<div class="sl"><span>بدهی بین شرکا وجود ندارد</span></div>'}</div><div class="gr4">`+S.partners.map(p=>{const x=b[p.id],t=frac()[p.id]*100;return`<div class="cd"><div class="hd"><h2>${p.name}</h2><span><button class="s" onclick="A.pAdd('${p.id}')">ویرایش</button> ${X('partners',p.id)}</span></div><small class="mut">${S.halls.filter(h=>(p.hs||{})[h.id]>0).map(h=>h.name+' '+fa(p.hs[h.id])+'٪').join('، ')} ${S.flocks.filter(f=>(f.sh||{})[p.id]>0).map(f=>fa(f.sh[p.id])+' در '+fb(f)).join('، ')||'بدون سهم'}</small><div class="pb"><i style="width:${t}%"></i></div><div class="mut" style="font-size:11px">سهم کل: ${fa(t)}٪</div><div class="t3"><span>پرداخت کرده</span><span>${mo(x.paid)}</span></div><div class="t3"><span>سهم از هزینه‌ها</span><span>${mo(x.cost)}</span></div><div class="t3"><span>سهم از درآمد</span><span>${mo(x.rev)}</span></div><div class="t3"><span>وجه دریافتی از فروش</span><span>${mo(x.rec)}</span></div><div class="t3"><b>تراز</b><b class="${x.net<0?'neg':'pos'}">${x.net<0?'بدهکار ':'بستانکار '}${mo(Math.abs(x.net))}</b></div></div>`}).join('')+`</div>`},
more(){const C=(i,t,d,f)=>`<button class="cd" style="text-align:right;display:flex;gap:12px;align-items:center;width:100%;margin:0" onclick="${f}"><div class="ic g" style="width:42px;height:42px">${i}</div><div><h2>${t}</h2><span class="mut" style="font-size:11px">${d}</span></div></button>`;return H('بیشتر','منابع، پیش‌فرض‌ها و تنظیمات')+`<div class="gr4">${C('📚','منابع و فرضیات','منبع هر عدد و داده‌های پیدا‌نشده','src()')}${C('📏','جدول‌های استاندارد',Object.keys(S.set.std).map(k=>k+' ('+fa(S.set.std[k].w.length)+' هفته)').join('، '),'A.std()')}${C('🌾','فازهای دان و پروتئین','پیش‌استارتر تا پایانی (Purdue/NRC)','A.ph()')}${C('💉','برنامه واکسن','نمونه اولیه، با دامپزشک نهایی شود','A.vac()')}${C('⚙️','پیش‌فرض‌ها','سقف بار زنده ('+fa(S.set.cap)+' کیلو/م²) و هشدار تراکم','A.df()')}${C('💾','پشتیبان‌گیری','داده‌ها فقط در همین مرورگر ذخیره می‌شوند','A.bk()')}</div>`}};
