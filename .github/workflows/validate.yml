name: Validate web app
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Test inventory date cutoffs
        run: node scripts/inventory-regression.test.mjs
